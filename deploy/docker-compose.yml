services:
  music-disc:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: music-disc
    restart: always
    env_file:
      - .env
    environment:
      # Keep SoundCloud working even if the server's gitignored application.yml is stale
      PLUGINS_SOUNDY_ENABLED: "true"
      LAVALINK_SERVER_SOURCES_SOUNDCLOUD: "false"
    volumes:
      - ./application.yml:/bot/server/application.yml   # Lavalink config
      - ./data:/bot/data                                # Bot SQLite database (playlists, queue persistence)
      - ./logs:/bot/logs                                # Bot logs
      - ../server/plugins:/bot/server/plugins           # Lavalink plugins (Soundy is committed in the repo)
      - ./lavalink/logs:/bot/server/logs                # Lavalink logs
    ports:
      - "33333:33333"                                   # Web dashboard
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

name: Deploy

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

# Serialize deploys on the single VPS: one running, the latest one queued
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and rebuild on the VPS
    runs-on: ubuntu-latest
    # Deploy is skipped when the VPS secrets are not configured yet
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_DIR: ${{ secrets.VPS_DIR }}
    steps:
      - name: Deploy over SSH
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ env.VPS_DIR }}
            git pull --ff-only
            cd deploy
            docker compose up -d --build
            docker image prune -f
